name: build-image

# push 到 main 即在 GitHub 上构建 Docker 镜像并推送到 GHCR（GitHub Container Registry）。
# 服务器只需 docker compose pull + up，无需在 2G 机上构建（不会 OOM）。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/xiaotecn/aichat:latest
            ghcr.io/xiaotecn/aichat:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
